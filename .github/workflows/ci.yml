name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    # Owner-authorized billing exception for PR380 only; see docs/qa/mealscout-ci-exception.md.
    # Main pushes and every other PR retain all existing CI steps.
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.number != 380 ||
          github.event.pull_request.head.repo.full_name != 'infotradescout/MealScout' ||
          github.head_ref != 'codex/ui-ux-front-end-overhaul-20260915' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: UI Refinement Syntax and Clipboard Regression
        run: node scripts/mealscout-ui-refinement.test.cjs

      - name: Pickup Checkout State Regression
        run: node scripts/mealscout-checkout-state.test.cjs

      - name: Order Status Recovery Regression
        run: node scripts/mealscout-order-status-state.test.cjs

      - name: Owner Orders and Kitchen State Regression
        run: node scripts/mealscout-owner-orders-state.test.cjs

      - name: Parking Pass Source Contracts
        run: node scripts/qa/parking-source-contracts.cjs

      - name: Parking Pass Repair Behavior Regression
        run: node scripts/qa/parking-repair.behavior.test.mjs

      - name: Parking Pass Return URL and Calendar Date Regression
        run: |
          node scripts/qa/parking-return-policy.test.cjs
          node scripts/qa/parking-calendar-date.test.cjs

      - name: Parking Pass Request Recovery Policy
        run: node scripts/qa/parking-booking-request.test.cjs

      - name: Parking Pass Durable Request Integration
        run: node scripts/qa/parking-durability.integration.test.mjs

      - name: Typecheck
        run: npm run check

      - name: TradeScout SSO Identity Validation
        run: node --test scripts/mealscout-tradescout-sso-identity.behavior.test.cjs

      - name: Stripe Webhook Safety
        run: npm run test:stripe-webhook-safety

      - name: Consumer Entity Foundation Contract
        run: npm run test:consumer-entity-foundation

      - name: Scout Fallback and Navigation Contract
        run: npm run test:scout-fallback

      - name: Canonical Scout Discovery Result Contract
        run: npm run test:scout-discovery-result

      - name: Scout Result View Model Contract
        run: npm run test:scout-result-view-model

      - name: Scout Map Truth Contract
        run: npm run test:map-truth

      - name: Public Profile Action Policy Contract
        run: npm run test:profile-action-policy

      - name: Business Type Taxonomy Contract
        run: npm run test:business-type-taxonomy

      - name: Business Signup Attachment Contract
        run: npm run test:business-signup-attachment

      - name: Food Truck Signup Funnel Contract
        run: npm run test:food-truck-signup-funnel

      - name: Truck Availability Truth Contract
        run: npm run test:truck-availability-truth

      - name: Canonical Profile Completion Truth Contract
        run: npm run test:profile-completion-truth

      - name: Owner Profile Evidence Review Contract
        run: npm run test:profile-evidence-owner-review

      - name: Public Data Boundary Contract
        run: npm run test:public-data-boundary

      - name: Public SEO Landing Boundary
        run: npm run test:public-seo-landing

      - name: Frozen Cleanup Safety Contract
        run: npm run test:frozen-cleanup-safety

      - name: Quick Review Score Validation Contract
        run: npm run test:quick-review-score-validation

      - name: Quick Review Idempotency Contract
        run: npm run test:quick-review-idempotency

      - name: Recommendation Photo Proof Contract
        run: npm run test:recommend-photo-only-proof

      - name: Manual Profile Asset Intake Contract
        run: npm run test:manual-asset-intake

      - name: Leaflet Removal Contract
        run: npm run test:leaflet-removal

      - name: Event Date Normalization Contract
        run: npm run test:event-date-normalization

      - name: Action Availability Contract
        run: npm run test:action-availability

      - name: Post-Merge Safety Contract
        run: npm run test:post-merge-safety

      - name: About Explainer Truth Contract
        run: npm run test:about-explainer

      - name: 3D Eats FRUI-TEA Evidence Contract
        run: npm run test:3d-eats-frui-tea-sauce

      - name: 3D Eats Admin-Verified Profile Contract
        run: npm run test:3d-eats-admin-verified-profile

      - name: Curated Profile Cohort Read-Only Baseline Contract
        run: npm run test:curated-profile-cohort-baseline

      - name: Runtime Safety Contracts
        run: |
          npx --yes tsx scripts/parking-pass-google-api-capabilities.contract.test.ts
          npx --yes tsx scripts/mealscout-infinity-shadow.contract.test.ts
          npx --yes tsx scripts/scout-parking-pass-host-truth.contract.test.ts
          npx --yes tsx scripts/parking-pass-capacity-concurrency.contract.test.ts

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: UI Refinement Isolated Layout Regression
        run: node scripts/mealscout-ui-refinement.browser.test.cjs

      - name: Pickup Checkout React Browser Regression
        run: node scripts/mealscout-checkout-browser.test.cjs

      - name: Parking Pass Payment React Browser Regression
        run: node scripts/mealscout-parking-payment.browser.test.cjs

      - name: Cross-Browser Route Regression (Chromium/Firefox/WebKit + Mobile)
        run: npm run test:flows:e2e:no-creds

      - name: Build
        run: npm run build

      - name: Mobile Readiness
        run: npm run check:mobile-readiness

      - name: Store Readiness (Strict Metadata)
        run: npm run check:store-readiness
        env:
          STRICT_STORE_METADATA: "true"
